services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: wasteland-trader-backend-dev
    environment:
      NODE_ENV: development
      PORT: 3000
      GAME_SESSIONS_DIR: /workspace/data/games
    ports:
      - "3000:3000"
    volumes:
      - ./:/workspace
      - /workspace/node_modules
      - /workspace/apps/backend/node_modules
    command: npm run dev
