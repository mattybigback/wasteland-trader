services:
  frontend:
    image: node:lts
    container_name: wasteland-trader-frontend-live-dev
    working_dir: /workspace
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: http://localhost:3000
    volumes:
      - ./:/workspace
      - /workspace/node_modules
      - /workspace/apps/frontend/node_modules
    command: sh -c "npm install && npm run dev --workspace @wasteland/frontend -- --host 0.0.0.0 --port 4173"
    ports:
      - "4173:4173"
